<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- `interactive-widget` stops Chrome on Android from shoving the whole page
         up when the keyboard opens; the layout resizes instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_SHORT%" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />

    <!-- What a pasted invite link looks like in WhatsApp, iMessage or Slack. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <title>%BRAND_NAME%</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <!-- The brand colour wins over the defaults in tokens.css. -->
    <style>
      %BRAND_STYLE%
    </style>
  </head>
  <body>
    <!-- Before any room exists: create one, or type a code. -->
    <div class="lobby" id="lobby" hidden></div>

    <div class="app" id="app" data-theatre="false" hidden>
      <header class="topbar" id="topbar"></header>

      <main class="stage" id="stage">
        <div class="screen" id="screen">
          <div class="screen__mount" id="screenMount"></div>
          <div class="screen__badge" id="screenBadge" hidden></div>
          <div class="screen__overlay" id="screenOverlay"></div>
        </div>
        <div class="controls" id="controls" hidden></div>
      </main>

      <aside class="panel" id="panel"></aside>
    </div>

    <div class="sheets" id="sheets"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
