<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Ved películas juntos en un navegador compartido de Hyperbeam, con chat en tiempo real."
    />
    <title>Watch Party</title>

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237c5cff'/%3E%3Cpath d='M38 32l30 18-30 18z' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app" id="app" data-theatre="false">
      <header class="topbar" id="topbar"></header>

      <main class="stage" id="stage">
        <div class="screen" id="screen">
          <div class="screen__mount" id="screenMount"></div>
          <div class="screen__badge" id="screenBadge" hidden></div>
          <div class="screen__overlay" id="screenOverlay"></div>
        </div>
        <div class="controls" id="controls" hidden></div>
      </main>

      <aside class="panel" id="panel"></aside>
    </div>

    <div class="sheets" id="sheets"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
